name: Actualizar radar y publicar Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10,16,22 * * *'
  push:
    branches: [main, master]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: football-${{ github.run_id }}
          restore-keys: football-
      - name: Consultar API-Football
        if: github.event_name != 'push'
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python scripts/audit_leagues.py
          python scripts/refresh.py --days 3
      - name: Reevaluar evidencia y vigencia
        run: python scripts/recheck.py
      - name: Conservar registro y liquidar resultados
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/tracking_history.py --remote --settle --publish
      - name: Preparar archivos públicos
        run: |
          mkdir public
          cp index.html history.html styles.css app.js dashboard.js live70.js config.json PROTOCOL_STANDINGS.md TELEGRAM.md public/
          cp -r data public/
          if [ -d reports ]; then cp -r reports public/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
